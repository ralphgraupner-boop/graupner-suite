  <!-- Footer -->
  <rect x="40" y="750" width="1320" height="135" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" rx="8"/>
  <text x="55" y="775" class="gname">⚠️ ZWINGENDE REGELN (siehe VISION.md)</text>
  <text x="55" y="800" class="legend">1. Module-First: Jedes neue Datenobjekt bekommt ein eigenes Verzeichnis /app/backend/module_*/  · Keine neuen Routen in /app/backend/routes/</text>
  <text x="55" y="820" class="legend">2. Datenmaske: Daten aus anderen Modulen LIVE per kunde_id/projekt_id joinen — niemals duplizieren (kunde_name oder adresse cachen).</text>
  <text x="55" y="840" class="legend">3. Auswahlfelder: ALLE Dropdowns (Status, Kategorien, Anreden, Mahnstufen, Reparaturgruppen, Materialien …) NUR über module_textvorlagen mit eigenem doc_type.</text>
  <text x="55" y="860" class="legend">4. Soft-Delete: Löschen schreibt in module_papierkorb (Tombstone), echtes Drop nur nach Bestätigung.</text>
  <text x="55" y="880" class="legend">5. Kommunikation auf Deutsch · konsultativer Stil · vor Architektur-Entscheidungen IMMER Ralph fragen.</text>
</svg>
