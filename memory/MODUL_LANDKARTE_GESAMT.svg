<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #475569; }
    .stamp { font-size: 11px; fill: #64748b; }
    .grp { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .mod { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .api { font-size: 10px; fill: #1e293b; font-family: Menlo, Consolas, monospace; }
    .flow { font-size: 11px; fill: #334155; }
    .new { font-size: 10px; font-weight: 700; fill: #d946ef; }
    .src { fill: #6366f1; stroke: #4338ca; }
    .ux { fill: #06b6d4; stroke: #0e7490; }
    .ext { fill: #f97316; stroke: #c2410c; }
    .data { fill: #10b981; stroke: #047857; }
    .mail { fill: #ef4444; stroke: #b91c1c; }
    .util { fill: #64748b; stroke: #334155; }
    .legend-box { fill: #f1f5f9; stroke: #cbd5e1; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow-new { fill: none; stroke: #d946ef; stroke-width: 2; marker-end: url(#arrow-pink); stroke-dasharray: 4 3; }
    .arrow-data { fill: none; stroke: #10b981; stroke-width: 1.5; marker-end: url(#arrow-green); stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d946ef"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="36" class="title">GraupnerSuite — Modul-Landkarte</text>
  <text x="40" y="58" class="subtitle">Datenfluss Mail → Kunde → Projekt · Auto-Vorschlag aus Anliegen-Text · Bild-Pipeline mit Thumbnails</text>
  <text x="40" y="76" class="stamp">Stand: 08.05.2026 · Module-First · Datenmasken (live join, keine Datendopplung) · Auswahllisten ausschließlich aus module_textvorlagen</text>

  <!-- ======================== EXTERN ======================== -->
  <g>
    <rect x="40" y="100" width="280" height="100" rx="8" class="ext"/>
    <text x="50" y="124" class="mod">Externe Quellen</text>
    <text x="50" y="146" class="api">Jimdo-Kontaktformular → Mail an</text>
    <text x="50" y="162" class="api">service24@tischlerei-graupner.de</text>
    <text x="50" y="180" class="api">IMAP fetch alle 15 min</text>
    <text x="50" y="195" class="new">P1: Public Contact API (geplant)</text>
  </g>

  <!-- ======================== MAIL ======================== -->
  <g>
    <rect x="40" y="230" width="280" height="170" rx="8" class="mail"/>
    <text x="50" y="254" class="mod">module_mail_inbox</text>
    <text x="50" y="276" class="api">/api/module-mail-inbox/scan</text>
    <text x="50" y="290" class="api">  → Parser (Anrede, Vor/Nachname,</text>
    <text x="50" y="304" class="api">     E-Mail, Tel, PLZ, Nachricht)</text>
    <text x="50" y="318" class="api">  → content_hash gegen Re-Sends</text>
    <text x="50" y="334" class="api">/list /detail /reevaluate-spam</text>
    <text x="50" y="350" class="api">/accept/{id}      (mit 409-Schutz)</text>
    <text x="50" y="364" class="api">/accept-link/{id} (an existierenden K.)</text>
    <text x="50" y="380" class="api">/migrate-anliegen-to-nachricht</text>
    <text x="50" y="396" class="new">★ NEU: Duplikatsschutz, Hash, Migration</text>
  </g>

  <!-- ======================== KUNDEN ======================== -->
  <g>
    <rect x="380" y="230" width="280" height="180" rx="8" class="src"/>
    <text x="390" y="254" class="mod">module_kunden  (Source-of-Truth)</text>
    <text x="390" y="278" class="api">/api/modules/kunden/data</text>
    <text x="390" y="292" class="api">Felder u.a.: nachricht, photos[],</text>
    <text x="390" y="306" class="api">  categories[], anrede, adresse</text>
    <text x="390" y="322" class="api">/counts (für Listen-Badges)</text>
    <text x="390" y="340" class="api">/sync-kontakt-status (auto)</text>
    <text x="390" y="358" class="api">/duplikate (Mail/Tel-normalisiert)</text>
    <text x="390" y="374" class="api">/papierkorb (Soft-Delete)</text>
    <text x="390" y="392" class="new">UI: KundenModulPage · NewProjektDialog</text>
    <text x="390" y="406" class="new">     Schnell-Anlage + Werkbank-Sprung</text>
  </g>

  <!-- ======================== PROJEKTE ======================== -->
  <g>
    <rect x="720" y="230" width="290" height="200" rx="8" class="src"/>
    <text x="730" y="254" class="mod">module_projekte</text>
    <text x="730" y="278" class="api">POST /api/module-projekte/</text>
    <text x="730" y="292" class="api">  validiert Status/Kategorie GEGEN</text>
    <text x="730" y="306" class="api">  module_textvorlagen (live)</text>
    <text x="730" y="322" class="api">  bilder_uebernehmen → kopiert</text>
    <text x="730" y="336" class="api">  Photo-Refs aus kunde.photos</text>
    <text x="730" y="354" class="api">/{id}/bilder Upload-Pipeline:</text>
    <text x="730" y="368" class="api">  Original 1920 px / Thumb 400 px</text>
    <text x="730" y="382" class="api">/files/{path}  Auth-Stream</text>
    <text x="730" y="396" class="api">/migrate-thumbnails (Altbestand)</text>
    <text x="730" y="410" class="api">/counts-by-kunde (Badge-Aggregat)</text>
    <text x="730" y="426" class="new">★ NEU: Pipeline, Lightbox, Whitelist</text>
  </g>

  <!-- ======================== TEXTVORLAGEN ======================== -->
  <g>
    <rect x="1060" y="230" width="290" height="220" rx="8" class="data"/>
    <text x="1070" y="254" class="mod">module_textvorlagen  ⚙️</text>
    <text x="1070" y="278" class="api">Globaler Auswahl-Speicher.</text>
    <text x="1070" y="292" class="api">doc_type:</text>
    <text x="1070" y="306" class="api">  kunden_status / kunden_kategorie</text>
    <text x="1070" y="320" class="api">  anrede / aufgaben_kategorie</text>
    <text x="1070" y="334" class="api">  reparaturgruppe / material</text>
    <text x="1070" y="348" class="api">  projekt_status / projekt_kategorie</text>
    <text x="1070" y="362" class="api">  projekt_bild_kategorie / projekt_titel</text>
    <text x="1070" y="380" class="api">+ keywords[] für Match-Engine</text>
    <text x="1070" y="398" class="api">/match  (text + doc_type → best/tied)</text>
    <text x="1070" y="412" class="api">/seed-projekt  (idempotent)</text>
    <text x="1070" y="430" class="api">/data CRUD + Tag-Input</text>
    <text x="1070" y="446" class="new">★ NEU: keywords-Feld + /match + Seed</text>
  </g>

  <!-- ======================== AUFGABEN / EINSÄTZE / TERMINE ======================== -->
  <g>
    <rect x="40" y="450" width="200" height="100" rx="8" class="src"/>
    <text x="50" y="474" class="mod">module_aufgaben</text>
    <text x="50" y="496" class="api">/api/module-aufgaben</text>
    <text x="50" y="510" class="api">kategorien aus textvorlagen</text>
    <text x="50" y="528" class="api">(doc_type=aufgaben_kategorie)</text>
  </g>
  <g>
    <rect x="260" y="450" width="200" height="100" rx="8" class="src"/>
    <text x="270" y="474" class="mod">module_einsaetze</text>
    <text x="270" y="496" class="api">/api/einsaetze</text>
    <text x="270" y="510" class="api">reparaturgruppen + materialien</text>
    <text x="270" y="528" class="api">aus textvorlagen</text>
  </g>
  <g>
    <rect x="480" y="450" width="200" height="100" rx="8" class="src"/>
    <text x="490" y="474" class="mod">module_termine</text>
    <text x="490" y="496" class="api">/api/module-termine</text>
    <text x="490" y="510" class="api">verknüpft mit kunden / projekt</text>
  </g>

  <!-- ======================== KUNDENLINK / PORTAL / VOICE ======================== -->
  <g>
    <rect x="700" y="450" width="280" height="100" rx="8" class="ux"/>
    <text x="710" y="474" class="mod">module_kundenlink</text>
    <text x="710" y="496" class="api">/m/{token} → Mitarbeiter-Link</text>
    <text x="710" y="510" class="api">expires_at + Verlängerung</text>
    <text x="710" y="528" class="new">P1: Auto-Invite nach Mail-Accept</text>
  </g>
  <g>
    <rect x="1000" y="450" width="280" height="100" rx="8" class="ux"/>
    <text x="1010" y="474" class="mod">module_kundenportal (v4)</text>
    <text x="1010" y="496" class="api">/api/portals → Public-View</text>
    <text x="1010" y="510" class="api">portal4_uploads + Documents</text>
  </g>

  <!-- ======================== STORAGE ======================== -->
  <g>
    <rect x="40" y="600" width="280" height="120" rx="8" class="util"/>
    <text x="50" y="624" class="mod">utils.storage  (Object-Store)</text>
    <text x="50" y="646" class="api">put_object / get_object</text>
    <text x="50" y="664" class="api">module_projekte/&lt;id&gt;/&lt;file&gt;.jpg</text>
    <text x="50" y="678" class="api">module_projekte/&lt;id&gt;/&lt;file&gt;.thumb.jpg</text>
    <text x="50" y="694" class="api">module_kunden/&lt;id&gt;/...</text>
    <text x="50" y="712" class="new">★ NEU: Thumb-Variante + Whitelist</text>
  </g>

  <!-- ======================== FRONTEND ======================== -->
  <g>
    <rect x="380" y="600" width="600" height="170" rx="8" class="ux"/>
    <text x="390" y="624" class="mod">Frontend (React + Tailwind + Shadcn)</text>
    <text x="390" y="648" class="api">pages/KundenModulPage.jsx → Liste, Schnell-+ , Werkbank-Badge</text>
    <text x="390" y="664" class="api">pages/projekte/ProjektWerkbank.jsx → Werkbank, Kategorien live</text>
    <text x="390" y="680" class="api">components/NewProjektDialog.jsx ★ NEU (wiederverwendbar)</text>
    <text x="390" y="696" class="api">  ↳ /modules/textvorlagen/match (Kategorie + Titel parallel)</text>
    <text x="390" y="712" class="api">components/ProjektBild.jsx ★ NEU (Blob-Load + Lightbox)</text>
    <text x="390" y="728" class="api">components/MailDetailModal + MailAcceptDuplicateDialog ★ NEU</text>
    <text x="390" y="744" class="api">pages/TextvorlagenModulPage.jsx → Tag-Input für keywords ★ NEU</text>
    <text x="390" y="762" class="api">lib/api.js → axios Bearer-Auth, baseURL = REACT_APP_BACKEND_URL</text>
  </g>

  <!-- Meta-Infos rechts -->
  <g>
    <rect x="1000" y="600" width="350" height="170" rx="8" class="legend-box"/>
    <text x="1015" y="624" class="grp">Architektur-Regeln (Pflicht)</text>
    <text x="1015" y="648" class="flow">1. Module-First — eigenes module_X/ pro Datenobjekt</text>
    <text x="1015" y="664" class="flow">2. Datenmasken — kunde_name etc. NIE duplizieren,</text>
    <text x="1015" y="678" class="flow">    via kunde_id live joinen</text>
    <text x="1015" y="694" class="flow">3. Auswahllisten ausschließlich aus module_textvorlagen</text>
    <text x="1015" y="710" class="flow">4. Vor Architektur-Entscheidungen: a/b/c-Optionen</text>
    <text x="1015" y="726" class="flow">5. Tests + Lint + curl-Smoke vor "fertig"</text>
    <text x="1015" y="744" class="flow">→ Details: AGENT_START_CHECKLISTE.md / VISION.md</text>
  </g>

  <!-- ======================== Beziehungen / Pfeile ======================== -->
  <!-- extern → mail -->
  <path d="M 180 200 L 180 230" class="arrow"/>
  <text x="186" y="220" class="flow">IMAP / API</text>

  <!-- mail → kunden (accept) -->
  <path d="M 320 320 L 380 310" class="arrow"/>
  <text x="324" y="306" class="flow">accept (409-Schutz)</text>

  <!-- kunden → projekte -->
  <path d="M 660 320 L 720 320" class="arrow"/>
  <text x="668" y="312" class="flow">kunde_id (Datenmaske)</text>

  <!-- projekte → storage -->
  <path d="M 760 430 L 220 600" class="arrow"/>
  <text x="540" y="538" class="flow">put / get_object</text>

  <!-- projekte → textvorlagen (match) -->
  <path d="M 1010 320 L 1060 320" class="arrow-new"/>
  <text x="1015" y="312" class="new">match</text>

  <!-- kunden → textvorlagen (kategorien) -->
  <path d="M 660 280 C 850 280 950 280 1060 280" class="arrow-data"/>

  <!-- aufgaben/einsaetze → textvorlagen -->
  <path d="M 240 480 C 800 480 950 480 1100 450" class="arrow-data"/>

  <!-- kunden → kundenlink -->
  <path d="M 600 410 L 780 450" class="arrow"/>

  <!-- mail → kunden (data flow) -->
  <path d="M 240 396 C 320 410 360 410 460 410" class="arrow"/>

  <!-- Legende unten -->
  <g>
    <rect x="40" y="800" width="1310" height="280" rx="8" class="legend-box"/>
    <text x="56" y="826" class="grp">Daten- &amp; Aktions-Flows  (was passiert beim Klick "Neues Projekt"?)</text>
    <text x="56" y="852" class="flow">1. KundenModulPage rendert Kunden inkl. projektCounts (GET /module-projekte/counts-by-kunde)</text>
    <text x="56" y="870" class="flow">2. Klick „+ Neues Projekt" → NewProjektDialog mit Kunde-Datenmaske geöffnet</text>
    <text x="56" y="888" class="flow">3. Dialog ruft parallel: GET /modules/textvorlagen/data?doc_type=projekt_kategorie  +  …=projekt_titel</text>
    <text x="56" y="906" class="flow">4. Dialog ruft POST /modules/textvorlagen/match mit kunde.nachricht für Kategorie + Titel</text>
    <text x="56" y="924" class="flow">5. Match liefert {best, candidates, tied} → grünes / blaues / gelbes Banner</text>
    <text x="56" y="942" class="flow">6. Pre-fill: Adresse, Beschreibung (=nachricht), Kategorie (=match.best.title), Titel (=match.best.content)</text>
    <text x="56" y="960" class="flow">7. POST /module-projekte/ legt Projekt an, validiert Felder gegen module_textvorlagen, kopiert Bilder optional</text>
    <text x="56" y="978" class="flow">8. Auto-Lernen: wenn Titel nicht in projekt_titel-Liste → POST /modules/textvorlagen/data (silent), Toast mit Undo</text>
    <text x="56" y="996" class="flow">9. ProjektBild lädt thumb_url (~20 KB) als Blob via /module-projekte/files/&lt;path&gt;, Lightbox lädt Original lazy</text>
    <text x="56" y="1014" class="flow">10. Bei Mail-Accept Duplikatstreffer: HTTP 409 → MailAcceptDuplicateDialog → entweder Zuordnen oder force_new</text>

    <text x="56" y="1042" class="grp">Legende</text>
    <rect x="56" y="1052" width="14" height="14" class="src"/><text x="78" y="1064" class="flow">Source-of-Truth-Modul</text>
    <rect x="220" y="1052" width="14" height="14" class="data"/><text x="242" y="1064" class="flow">module_textvorlagen (Auswahl &amp; Match)</text>
    <rect x="490" y="1052" width="14" height="14" class="mail"/><text x="512" y="1064" class="flow">Mail-Eingang</text>
    <rect x="640" y="1052" width="14" height="14" class="ux"/><text x="662" y="1064" class="flow">Externe UI / Portal</text>
    <rect x="810" y="1052" width="14" height="14" class="util"/><text x="832" y="1064" class="flow">Utility / Storage</text>
    <rect x="970" y="1052" width="14" height="14" class="ext"/><text x="992" y="1064" class="flow">Externe Quelle</text>
    <text x="1140" y="1064" class="new">★ NEU am 08.05.2026</text>
  </g>
</svg>
