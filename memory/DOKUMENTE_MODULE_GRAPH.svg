<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .sublabel { font-size: 11px; fill: #475569; }
      .endpoint { font-size: 10px; fill: #0f766e; font-family: monospace; }
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .legend { font-size: 11px; fill: #334155; }
    </style>
  </defs>

  <!-- Header -->
  <text x="700" y="35" text-anchor="middle" class="title">Dokumente — Modul-Abhaengigkeiten</text>
  <text x="700" y="58" text-anchor="middle" class="subtitle">Stand 07.05.2026 · alle API-Pfade unter /api/...</text>

  <!-- Frontend layer -->
  <rect x="40" y="90" width="1320" height="170" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="8"/>
  <text x="55" y="112" class="label">Frontend (React)</text>

  <!-- DokumenteModulPage Tab-Wrapper -->
  <rect x="540" y="130" width="320" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="700" y="155" text-anchor="middle" class="label">DokumenteModulPage.jsx</text>
  <text x="700" y="175" text-anchor="middle" class="sublabel">/module/dokumente · Tab-Wrapper</text>

  <!-- Tab pages -->
  <rect x="80" y="210" width="180" height="40" fill="#fff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="170" y="235" text-anchor="middle" class="label">QuotesPage.jsx</text>

  <rect x="280" y="210" width="180" height="40" fill="#fff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="370" y="235" text-anchor="middle" class="label">OrdersPage.jsx</text>

  <rect x="480" y="210" width="180" height="40" fill="#fff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="570" y="235" text-anchor="middle" class="label">InvoicesPage.jsx</text>

  <rect x="680" y="210" width="220" height="40" fill="#fff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="790" y="235" text-anchor="middle" class="label">DocumentTemplatesPanel</text>

  <rect x="920" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="1020" y="235" text-anchor="middle" class="label">WysiwygDocumentEditor</text>
  <text x="1020" y="200" text-anchor="middle" class="sublabel">Editor (alle 3 Doc-Arten)</text>

  <!-- arrows from DokumenteModulPage to tabs -->
  <line x1="700" y1="190" x2="170" y2="210" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="370" y2="210" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="570" y2="210" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="790" y2="210" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Backend Module layer -->
  <rect x="40" y="290" width="1320" height="380" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="8"/>
  <text x="55" y="312" class="label">Backend Module (FastAPI · Module-First seit 07.05.2026)</text>

  <!-- module_angebote -->
  <rect x="80" y="340" width="180" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="170" y="362" text-anchor="middle" class="label">module_angebote/</text>
  <text x="170" y="380" text-anchor="middle" class="sublabel">routes.py</text>
  <text x="170" y="398" text-anchor="middle" class="endpoint">/api/quotes/*</text>
  <text x="170" y="412" text-anchor="middle" class="endpoint">DB: quotes</text>

  <!-- module_auftraege -->
  <rect x="280" y="340" width="180" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="370" y="362" text-anchor="middle" class="label">module_auftraege/</text>
  <text x="370" y="380" text-anchor="middle" class="sublabel">routes.py</text>
  <text x="370" y="398" text-anchor="middle" class="endpoint">/api/orders/*</text>
  <text x="370" y="412" text-anchor="middle" class="endpoint">DB: orders</text>

  <!-- module_rechnungen -->
  <rect x="480" y="340" width="180" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="570" y="362" text-anchor="middle" class="label">module_rechnungen/</text>
  <text x="570" y="380" text-anchor="middle" class="sublabel">routes_v1 + routes_v2</text>
  <text x="570" y="398" text-anchor="middle" class="endpoint">/api/invoices/*</text>
  <text x="570" y="412" text-anchor="middle" class="endpoint">DB: invoices</text>

  <!-- module_dokumente -->
  <rect x="680" y="340" width="220" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="790" y="362" text-anchor="middle" class="label">module_dokumente/</text>
  <text x="790" y="380" text-anchor="middle" class="sublabel">routes_legacy/_manager/_templates/_data</text>
  <text x="790" y="398" text-anchor="middle" class="endpoint">/api/document-templates/*</text>
  <text x="790" y="412" text-anchor="middle" class="endpoint">DB: document_templates</text>

  <!-- arrows: tab -> module -->
  <line x1="170" y1="250" x2="170" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="370" y1="250" x2="370" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="250" x2="570" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="790" y1="250" x2="790" y2="340" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1020" y1="250" x2="570" y2="340" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4 3"/>
  <line x1="1020" y1="250" x2="170" y2="340" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4 3"/>
  <line x1="1020" y1="250" x2="370" y2="340" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)" stroke-dasharray="4 3"/>

  <!-- Cross-module workflow ketten -->
  <line x1="260" y1="380" x2="280" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="270" y="338" text-anchor="middle" class="endpoint" fill="#dc2626">Angebot → Auftrag</text>

  <line x1="460" y1="380" x2="480" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="470" y="338" text-anchor="middle" class="endpoint" fill="#dc2626">Auftrag → Rechnung</text>

