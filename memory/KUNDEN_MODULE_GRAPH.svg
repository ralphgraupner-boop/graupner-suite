<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .label { font-size: 13px; fill: #1e293b; font-weight: 600; }
      .sub { font-size: 11px; fill: #475569; }
      .ep { font-size: 10px; fill: #0f766e; font-family: monospace; }
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .legend { font-size: 11px; fill: #334155; }
      .warn { font-size: 12px; fill: #b45309; font-weight: 600; }
    </style>
  </defs>

  <text x="700" y="35" text-anchor="middle" class="title">Kunden — Modul-Abhängigkeiten</text>
  <text x="700" y="58" text-anchor="middle" class="subtitle">module_kunden ist Source-of-Truth · Datenmaske: andere Module joinen per kunde_id</text>

  <!-- Frontend -->
  <rect x="40" y="90" width="1320" height="170" fill="#eff6ff" stroke="#bfdbfe" rx="8"/>
  <text x="55" y="112" class="label">Frontend</text>

  <rect x="540" y="130" width="320" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="700" y="155" text-anchor="middle" class="label">KundenModulPage.jsx</text>
  <text x="700" y="175" text-anchor="middle" class="sub">/module/kunden · Liste, Detail, Form, Aktionen</text>

  <rect x="80" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" rx="5"/>
  <text x="180" y="235" text-anchor="middle" class="label">KundenLinkDialog</text>

  <rect x="300" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" rx="5"/>
  <text x="400" y="235" text-anchor="middle" class="label">AbschlussDialog</text>

  <rect x="520" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" rx="5"/>
  <text x="620" y="235" text-anchor="middle" class="label">MailHistoryModal</text>

  <rect x="740" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" rx="5"/>
  <text x="840" y="235" text-anchor="middle" class="label">AufgabenPanel (Quick)</text>

  <rect x="960" y="210" width="200" height="40" fill="#fff" stroke="#3b82f6" rx="5"/>
  <text x="1060" y="235" text-anchor="middle" class="label">DuplikateCheck</text>

  <line x1="700" y1="190" x2="180" y2="210" stroke="#3b82f6" marker-end="url(#ar)"/>
  <line x1="700" y1="190" x2="400" y2="210" stroke="#3b82f6" marker-end="url(#ar)"/>
  <line x1="700" y1="190" x2="620" y2="210" stroke="#3b82f6" marker-end="url(#ar)"/>
  <line x1="700" y1="190" x2="840" y2="210" stroke="#3b82f6" marker-end="url(#ar)"/>
  <line x1="700" y1="190" x2="1060" y2="210" stroke="#3b82f6" marker-end="url(#ar)"/>

  <!-- Module -->
  <rect x="40" y="290" width="1320" height="270" fill="#f0fdf4" stroke="#bbf7d0" rx="8"/>
  <text x="55" y="312" class="label">Backend Module</text>

  <!-- Kern -->
  <rect x="540" y="335" width="320" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="3" rx="6"/>
  <text x="700" y="358" text-anchor="middle" class="label">module_kunden/  (Source-of-Truth)</text>
  <text x="700" y="378" text-anchor="middle" class="sub">routes_legacy.py + routes_data.py</text>
  <text x="700" y="396" text-anchor="middle" class="ep">/api/customers/*</text>
  <text x="700" y="412" text-anchor="middle" class="ep">/api/modules/kunden/*</text>
  <text x="700" y="428" text-anchor="middle" class="ep">DB: module_kunden</text>

  <line x1="700" y1="250" x2="700" y2="335" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>

  <!-- Querschnitte links -->
  <rect x="80" y="335" width="180" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="170" y="358" text-anchor="middle" class="label">module_textvorlagen</text>
  <text x="170" y="376" text-anchor="middle" class="ep">doc_type=kunden_status,</text>
  <text x="170" y="390" text-anchor="middle" class="ep">kunden_kategorie, anrede,</text>
  <text x="170" y="404" text-anchor="middle" class="ep">abschlussgrund</text>

  <rect x="280" y="335" width="180" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="370" y="358" text-anchor="middle" class="label">module_duplikate</text>
  <text x="370" y="376" text-anchor="middle" class="ep">/api/duplikate/*</text>
  <text x="370" y="394" text-anchor="middle" class="sub">Email/Tel-Match</text>

  <rect x="80" y="430" width="180" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="170" y="453" text-anchor="middle" class="label">module_kunde_delete</text>
  <text x="170" y="471" text-anchor="middle" class="ep">/api/kunde-delete/*</text>
  <text x="170" y="489" text-anchor="middle" class="sub">DSGVO-Workflow</text>

  <rect x="280" y="430" width="180" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="370" y="453" text-anchor="middle" class="label">module_papierkorb</text>
  <text x="370" y="471" text-anchor="middle" class="ep">/api/papierkorb/*</text>
  <text x="370" y="489" text-anchor="middle" class="sub">Soft-Delete-Tombstone</text>

  <line x1="540" y1="385" x2="260" y2="375" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="540" y1="395" x2="460" y2="375" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="540" y1="405" x2="260" y2="470" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="540" y1="415" x2="460" y2="470" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>

  <!-- Querschnitte rechts -->
  <rect x="940" y="335" width="200" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="1040" y="358" text-anchor="middle" class="label">module_kundenlink</text>
  <text x="1040" y="376" text-anchor="middle" class="ep">/api/module-kundenlink/*</text>
  <text x="1040" y="394" text-anchor="middle" class="sub">Token-Links für Monteure</text>

  <rect x="1160" y="335" width="200" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="1260" y="358" text-anchor="middle" class="label">module_mail_inbox</text>
  <text x="1260" y="376" text-anchor="middle" class="ep">/api/module-mail-inbox/*</text>
  <text x="1260" y="394" text-anchor="middle" class="sub">Mail → Kunde anlegen</text>

  <rect x="940" y="430" width="200" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="1040" y="453" text-anchor="middle" class="label">module_aufgaben</text>
  <text x="1040" y="471" text-anchor="middle" class="ep">/api/module-aufgaben/*</text>
  <text x="1040" y="489" text-anchor="middle" class="sub">aufgaben.kunde_id ↦ kunde</text>

  <rect x="1160" y="430" width="200" height="80" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="1260" y="453" text-anchor="middle" class="label">module_termine</text>
  <text x="1260" y="471" text-anchor="middle" class="ep">/api/module-termine/*</text>
  <text x="1260" y="489" text-anchor="middle" class="sub">termine.kunde_id ↦ kunde</text>

  <line x1="860" y1="385" x2="940" y2="375" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="860" y1="395" x2="1160" y2="375" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="860" y1="405" x2="940" y2="470" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>
  <line x1="860" y1="415" x2="1160" y2="470" stroke="#d97706" marker-end="url(#ar)" stroke-dasharray="3 2"/>

  <!-- Workflow-Module die Kunden referenzieren -->
  <rect x="40" y="590" width="1320" height="180" fill="#dcfce7" stroke="#16a34a" rx="8"/>
  <text x="55" y="612" class="label">Workflow-Module die module_kunden referenzieren (per kunde_id)</text>

  <rect x="80" y="630" width="180" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="170" y="652" text-anchor="middle" class="label">module_angebote</text>
  <text x="170" y="670" text-anchor="middle" class="ep">find_customer_in_modules</text>

  <rect x="280" y="630" width="180" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="370" y="652" text-anchor="middle" class="label">module_auftraege</text>
  <text x="370" y="670" text-anchor="middle" class="ep">orders.kunde_id</text>

  <rect x="480" y="630" width="180" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="570" y="652" text-anchor="middle" class="label">module_rechnungen</text>
  <text x="570" y="670" text-anchor="middle" class="ep">invoices.kunde_id</text>

  <rect x="680" y="630" width="180" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="770" y="652" text-anchor="middle" class="label">module_einsaetze</text>
  <text x="770" y="670" text-anchor="middle" class="ep">einsaetze.kunde_id</text>

  <rect x="880" y="630" width="180" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="970" y="652" text-anchor="middle" class="label">module_projekte</text>
  <text x="970" y="670" text-anchor="middle" class="ep">projekte.kunde_id</text>

  <rect x="1080" y="630" width="200" height="60" fill="#fff" stroke="#16a34a" stroke-width="2" rx="5"/>
  <text x="1180" y="652" text-anchor="middle" class="label">module_kundenportal</text>
  <text x="1180" y="670" text-anchor="middle" class="ep">portals.kunde_id</text>

  <line x1="170" y1="630" x2="650" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>
  <line x1="370" y1="630" x2="660" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>
  <line x1="570" y1="630" x2="670" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>
  <line x1="770" y1="630" x2="700" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>
  <line x1="970" y1="630" x2="730" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>
  <line x1="1180" y1="630" x2="740" y2="435" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arG)" stroke-dasharray="4 3"/>

  <text x="700" y="730" text-anchor="middle" class="warn">⚠️ Datenmaske: kein Modul speichert kunde_name oder adresse — alles wird live aus module_kunden geholt!</text>

  <!-- DB -->
  <rect x="40" y="800" width="1320" height="120" fill="#fef2f2" stroke="#fecaca" rx="8"/>
  <text x="55" y="822" class="label">MongoDB</text>

  <rect x="80" y="840" width="240" height="60" fill="#fff" stroke="#dc2626" rx="4"/>
  <text x="200" y="860" text-anchor="middle" class="label">module_kunden</text>
  <text x="200" y="878" text-anchor="middle" class="sub">id (UUID), email, vorname, nachname, firma,</text>
  <text x="200" y="892" text-anchor="middle" class="sub">phone, adresse, status, kategorie, anrede,</text>

  <rect x="340" y="840" width="200" height="60" fill="#fff" stroke="#dc2626" rx="4"/>
  <text x="440" y="860" text-anchor="middle" class="label">module_papierkorb</text>
  <text x="440" y="878" text-anchor="middle" class="sub">soft-deleted Kunden</text>

  <rect x="560" y="840" width="200" height="60" fill="#fff" stroke="#dc2626" rx="4"/>
  <text x="660" y="860" text-anchor="middle" class="label">module_textvorlagen</text>
  <text x="660" y="878" text-anchor="middle" class="sub">Status-, Kategorie-, Anrede-Optionen</text>

  <rect x="780" y="840" width="200" height="60" fill="#fff" stroke="#dc2626" rx="4"/>
  <text x="880" y="860" text-anchor="middle" class="label">module_kundenlink</text>
  <text x="880" y="878" text-anchor="middle" class="sub">Token, expires_at, kunde_id, projekt_id</text>

  <!-- Legende -->
  <rect x="1000" y="940" width="380" height="50" fill="#fff" stroke="#cbd5e1" rx="4"/>
  <line x1="1015" y1="955" x2="1045" y2="955" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <text x="1055" y="960" class="legend">Datenfluss / Lookup per kunde_id</text>
  <line x1="1015" y1="975" x2="1045" y2="975" stroke="#d97706" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <text x="1055" y="980" class="legend">Hilfs-/Querschnittsmodul</text>
</svg>
